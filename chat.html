*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#0047CC;--blue-dark:#003399;--blue-light:#EEF3FF;
  --green:#00A550;--green-light:#F0FFF6;
  --orange:#FF8C00;--orange-light:#FFF7F0;
  --red:#E8001C;--red-light:#FFF0F0;
  --text:#0D1117;--text2:#4A5568;--text3:#718096;
  --bg:#F7F9FC;--white:#FFFFFF;--border:#E2E8F0;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-ico{width:36px;height:36px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:white;}
.logo-nm{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--text);}
.back{font-size:14px;color:var(--text2);text-decoration:none;font-weight:600;}
.wrap{padding:16px;max-width:480px;margin:0 auto;padding-bottom:100px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
.card-ttl{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:16px;}
.hero-block{background:linear-gradient(135deg,#0D1B40,#0047CC);padding:24px 20px;color:white;margin-bottom:16px;}
.hero-ttl{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:800;margin-bottom:6px;}
.hero-sub{font-size:14px;opacity:0.8;}
.btn{width:100%;padding:16px;background:var(--blue);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:block;text-align:center;text-decoration:none;margin-bottom:10px;}
.btn2{width:100%;padding:14px;background:var(--bg);color:var(--text2);border:1px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:block;text-align:center;text-decoration:none;}
.botnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;padding:10px 0 18px;z-index:50;}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;}
.bni-ico{font-size:22px;}
.bni-lbl{font-size:11px;font-weight:600;color:var(--text3);}
.bni.active .bni-lbl{color:var(--blue);}

.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 130px);}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:80%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.5;}
.msg.bot{background:var(--white);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.user{background:var(--blue);color:white;align-self:flex-end;border-bottom-right-radius:4px;}
.msg-name{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:4px;}
.input-wrap{background:var(--white);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;}
.chat-input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:24px;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;}
.chat-input:focus{border-color:var(--blue);}
.send-btn{width:44px;height:44px;background:var(--blue);color:white;border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.quick-btns{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--border);}
.quick-btn{white-space:nowrap;padding:8px 14px;background:var(--blue-light);color:var(--blue);border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
</style>
</head><body>
<div class="topbar">
  <a href="/" class="logo"><div class="logo-ico"><img src="https://raw.githubusercontent.com/amberagroupsa01-eng/amberaai-web/main/tracium.png" style="width:100%;height:100%;border-radius:10px;object-fit:cover;" onerror="this.style.display='none'"></div><span class="logo-nm">Tracium</span></a>
  <div style="display:flex;gap:4px;background:#F7F9FC;border-radius:20px;padding:3px;margin-left:auto;">
    <button onclick="setLang('fr')" id="btn-fr" style="padding:4px 10px;border:none;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;background:#0047CC;color:white;">FR</button>
    <button onclick="setLang('en')" id="btn-en" style="padding:4px 10px;border:none;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:#718096;">EN</button>
  </div>
  <a href="/app" class="back">← Retour</a>
</div>
<div class="quick-btns">
  <button class="quick-btn" onclick="sendQuick('Comment bloquer mon véhicule ?')">🔒 Bloquer véhicule</button>
  <button class="quick-btn" onclick="sendQuick('Mon abonnement expire quand ?')">📅 Mon abonnement</button>
  <button class="quick-btn" onclick="sendQuick('Comment contacter un installateur ?')">🔧 Installateur</button>
  <button class="quick-btn" onclick="sendQuick('Qu\'est-ce que Tracium DNA ?')">🧬 Tracium DNA</button>
</div>
<div class="chat-wrap">
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="msg-name">🤖 Tracium Assistant</div>
      Bonjour ! Je suis l'assistant Tracium. Comment puis-je vous aider à protéger votre véhicule aujourd'hui ?
    </div>
  </div>
  <div class="input-wrap">
    <input class="chat-input" id="chatInput" placeholder="Posez votre question..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>
<script>
const responses = {
  default: "Je comprends votre question. Pour une aide personnalisée, contactez notre équipe à support@tracium.app ou via WhatsApp.",
  bloquer: "Pour bloquer votre véhicule : allez sur /blocage et appuyez sur 'Bloquer le moteur'. Cela ne s'active que si le véhicule est à l'arrêt pour votre sécurité.",
  abonnement: "Votre abonnement est visible dans votre Dashboard. Vous recevrez une notification WhatsApp 5 jours avant expiration. Pour renouveler, allez sur /payment.",
  installateur: "Un installateur certifié Tracium sera assigné après votre commande de kit. Délai : 48h. Contactez-nous à install@tracium.app si urgent.",
  dna: "Tracium DNA est un marquage UV invisible et indélébile appliqué sur votre véhicule. Visible uniquement sous lumière UV. Permet d'identifier votre véhicule même si le VIN est effacé.",
  urgence: "En cas d'urgence : appuyez sur le bouton rouge SÉCURISER MA VOITURE sur l'accueil. La police et vos contacts seront alertés automatiquement.",
  prix: "Nos kits : Basic 100 000 FCFA, Pro 120 000 FCFA, Premium 200 000 FCFA. Abonnements : Basic 3 000, Pro 5 000, Premium 10 000 FCFA/mois.",
};

function getResponse(msg) {
  msg = msg.toLowerCase();
  if (msg.includes('bloquer') || msg.includes('moteur') || msg.includes('verrouiller')) return responses.bloquer;
  if (msg.includes('abonnement') || msg.includes('expire') || msg.includes('renouveler')) return responses.abonnement;
  if (msg.includes('installateur') || msg.includes('installation') || msg.includes('kit')) return responses.installateur;
  if (msg.includes('dna') || msg.includes('marquage') || msg.includes('uv')) return responses.dna;
  if (msg.includes('urgence') || msg.includes('vol') || msg.includes('danger')) return responses.urgence;
  if (msg.includes('prix') || msg.includes('tarif') || msg.includes('fcfa') || msg.includes('coût')) return responses.prix;
  return responses.default;
}

function addMsg(text, type) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (type === 'bot') div.innerHTML = '<div class="msg-name">🤖 Tracium Assistant</div>' + text;
  else div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  addMsg(msg, 'user');
  input.value = '';
  setTimeout(() => addMsg(getResponse(msg), 'bot'), 800);
}

function sendQuick(msg) {
  document.getElementById('chatInput').value = msg;
  sendMsg();
}

window.sendMsg = sendMsg;
window.sendQuick = sendQuick;
</script>

<script>
// ── BILINGUE FR/EN ──
(function() {
  var lang = localStorage.getItem('tracium-lang') || 'fr';
  
  function applyLang(l) {
    lang = l;
    localStorage.setItem('tracium-lang', l);
    var fr = document.getElementById('btn-fr');
    var en = document.getElementById('btn-en');
    if (fr) { fr.style.background = l==='fr'?'#0047CC':'transparent'; fr.style.color = l==='fr'?'white':'#718096'; }
    if (en) { en.style.background = l==='en'?'#0047CC':'transparent'; en.style.color = l==='en'?'white':'#718096'; }
    document.querySelectorAll('[data-fr]').forEach(function(el) {
      el.textContent = l==='fr' ? el.getAttribute('data-fr') : el.getAttribute('data-en');
    });
  }
  
  window.setLang = applyLang;
  
  document.addEventListener('DOMContentLoaded', function() {
    applyLang(lang);
  });
})();
</script>
</body></html>
