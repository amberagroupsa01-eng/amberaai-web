<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<title>Tracium — Espace Installateur</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --blue:#0047CC;--blue-dark:#003399;--blue-light:#EEF3FF;
  --green:#00A550;--green-light:#F0FFF6;
  --text:#0D1117;--text2:#4A5568;--text3:#718096;
  --bg:#F7F9FC;--white:#FFFFFF;--border:#E2E8F0;
}
html,body{min-height:100%;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;}

.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-ico{width:36px;height:36px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.logo-ico img{width:100%;height:100%;border-radius:10px;object-fit:cover;}
.logo-nm{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--text);}

.wrap{max-width:480px;margin:0 auto;padding:24px 16px 40px;}

.hero{background:linear-gradient(135deg,#0D1B40,#0047CC);border-radius:20px;padding:28px 24px;color:white;margin-bottom:24px;text-align:center;}
.hero-ico{font-size:48px;margin-bottom:12px;}
.hero-ttl{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:800;margin-bottom:6px;}
.hero-sub{font-size:14px;opacity:0.8;line-height:1.5;}

.tabs{display:flex;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px;}
.tab{flex:1;padding:10px;text-align:center;border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text3);border-radius:10px;cursor:pointer;transition:.2s;}
.tab.active{background:var(--blue);color:white;}

.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;}
.page{display:none;}
.page.active{display:block;}

.form-group{margin-bottom:16px;}
.form-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:var(--white);color:var(--text);}
.form-input:focus{border-color:var(--blue);}
.form-select{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;background:var(--white);color:var(--text);appearance:none;}
.form-select:focus{border-color:var(--blue);}

.btn{width:100%;padding:16px;background:var(--blue);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px;}
.btn:disabled{opacity:0.6;cursor:not-allowed;}

.err{color:#E8001C;font-size:13px;margin-top:8px;display:none;}
.err.show{display:block;}
.succ{color:var(--green);font-size:13px;margin-top:8px;display:none;background:var(--green-light);padding:10px 14px;border-radius:8px;}
.succ.show{display:block;}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:13px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

.back-link{text-align:center;margin-top:16px;font-size:14px;color:var(--text3);}
.back-link a{color:var(--blue);font-weight:600;text-decoration:none;}

.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--blue-light);color:var(--blue);margin-bottom:16px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-ico"><img src="https://raw.githubusercontent.com/amberagroupsa01-eng/amberaai-web/main/tracium.png" onerror="this.style.display='none'"></div>
    <span class="logo-nm">Tracium</span>
  </a>
  <a href="/auth" style="font-size:14px;color:var(--text2);text-decoration:none;font-weight:600;">← Espace client</a>
</div>

<div class="wrap">
  <div class="hero">
    <div class="hero-ico">🔧</div>
    <div class="hero-ttl">Espace Installateur</div>
    <div class="hero-sub">Rejoignez le réseau des techniciens certifiés Tracium et gérez vos missions d'installation.</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('login')">Connexion</button>
    <button class="tab" onclick="showTab('register')">Devenir installateur</button>
  </div>

  <!-- PAGE CONNEXION -->
  <div class="page active" id="page-login">
    <div class="card">
      <div class="badge">🔧 Accès technicien</div>
      <div class="form-group">
        <label class="form-label">Email professionnel</label>
        <input class="form-input" id="loginEmail" type="email" placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="••••••••">
      </div>
      <div class="err" id="loginError"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()">🔓 Se connecter</button>
    </div>
    <div class="back-link">Pas encore installateur ? <a href="#" onclick="showTab('register')">Rejoindre le réseau</a></div>
  </div>

  <!-- PAGE INSCRIPTION INSTALLATEUR -->
  <div class="page" id="page-register">
    <div class="card">
      <div class="badge">✅ Inscription gratuite</div>

      <div class="form-group">
        <label class="form-label">Nom complet *</label>
        <input class="form-input" id="regName" type="text" placeholder="Jean Dupont">
      </div>
      <div class="form-group">
        <label class="form-label">Email *</label>
        <input class="form-input" id="regEmail" type="email" placeholder="votre@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">Téléphone *</label>
        <input class="form-input" id="regPhone" type="tel" placeholder="+237 6XX XXX XXX">
      </div>
      <div class="form-group">
        <label class="form-label">Nom du garage / atelier</label>
        <input class="form-input" id="regGarage" type="text" placeholder="Ex: Garage Ambera Auto">
      </div>
      <div class="form-group">
        <label class="form-label">Ville d'intervention *</label>
        <select class="form-select" id="regCity">
          <option value="">Choisir une ville</option>
          <option value="Yaoundé">Yaoundé</option>
          <option value="Douala">Douala</option>
          <option value="Bafoussam">Bafoussam</option>
          <option value="Bamenda">Bamenda</option>
          <option value="Garoua">Garoua</option>
          <option value="Maroua">Maroua</option>
          <option value="Ngaoundéré">Ngaoundéré</option>
          <option value="Bertoua">Bertoua</option>
          <option value="Ebolowa">Ebolowa</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Spécialité</label>
        <select class="form-select" id="regSpecialite">
          <option value="Électronique auto">Électronique automobile</option>
          <option value="Mécanique générale">Mécanique générale</option>
          <option value="Électricité auto">Électricité automobile</option>
          <option value="Multiservices">Multiservices</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe *</label>
        <input class="form-input" id="regPassword" type="password" placeholder="Minimum 6 caractères">
      </div>
      <div class="err" id="regError"></div>
      <div class="succ" id="regSuccess"></div>
      <button class="btn" id="regBtn" onclick="doRegister()">🔧 Rejoindre le réseau Tracium</button>
    </div>
    <div class="back-link">Déjà inscrit ? <a href="#" onclick="showTab('login')">Se connecter</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyATWUfF5OFw860JXw76Uo9G_0jAI6hF6WE",
  authDomain: "ambera-ai.firebaseapp.com",
  projectId: "ambera-ai",
  storageBucket: "ambera-ai.firebasestorage.app",
  messagingSenderId: "581529826084",
  appId: "1:581529826084:web:144a6ce179e0d8286979b1"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Si déjà connecté en tant qu'installateur → rediriger
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists() && snap.data().role === 'installateur') {
      window.location.href = '/installer';
    }
    // Si c'est un client qui visite cette page → le laisser, pas le rediriger
  } catch(e) {}
});

// Connexion installateur
window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!email || !password) { errEl.textContent = 'Remplissez tous les champs.'; errEl.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Connexion...';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    // Vérifier que c'est bien un installateur
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    if (!snap.exists() || snap.data().role !== 'installateur') {
      errEl.textContent = '⛔ Ce compte n\'est pas un compte installateur. Utilisez l\'espace client.';
      errEl.classList.add('show');
      await auth.signOut();
      btn.disabled = false; btn.textContent = '🔓 Se connecter';
      return;
    }
    window.location.href = '/installer';
  } catch(e) {
    errEl.textContent = e.code === 'auth/invalid-credential' ? 'Email ou mot de passe incorrect.' : 'Erreur de connexion.';
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = '🔓 Se connecter';
  }
};

// Inscription installateur
window.doRegister = async function() {
  const name     = document.getElementById('regName').value.trim();
  const email    = document.getElementById('regEmail').value.trim();
  const phone    = document.getElementById('regPhone').value.trim();
  const garage   = document.getElementById('regGarage').value.trim();
  const city     = document.getElementById('regCity').value;
  const specialite = document.getElementById('regSpecialite').value;
  const password = document.getElementById('regPassword').value;
  const errEl    = document.getElementById('regError');
  const succEl   = document.getElementById('regSuccess');
  const btn      = document.getElementById('regBtn');

  errEl.classList.remove('show');
  if (!name || !email || !phone || !city || !password) {
    errEl.textContent = 'Remplissez tous les champs obligatoires (*).';
    errEl.classList.add('show'); return;
  }
  if (password.length < 6) {
    errEl.textContent = 'Le mot de passe doit avoir au moins 6 caractères.';
    errEl.classList.add('show'); return;
  }

  btn.disabled = true; btn.textContent = 'Inscription...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });

    const referralCode = 'TRC-' + cred.user.uid.slice(0,6).toUpperCase();

    // Sauvegarder dans users (avec rôle installateur)
    await setDoc(doc(db, 'users', cred.user.uid), {
      uid: cred.user.uid, name, email, phone,
      role: 'installateur',
      createdAt: serverTimestamp()
    });

    // Sauvegarder dans installers (profil complet)
    await setDoc(doc(db, 'installers', cred.user.uid), {
      userId: cred.user.uid, name, email, phone,
      garage: garage || '', city, specialite,
      status: 'active', rating: 5.0,
      totalMissions: 0, referralCode,
      createdAt: serverTimestamp()
    });

    succEl.textContent = '✅ Compte créé ! Redirection vers votre dashboard...';
    succEl.classList.add('show');
    setTimeout(() => window.location.href = '/installer', 2000);
  } catch(e) {
    errEl.textContent = e.code === 'auth/email-already-in-use' ? 'Cet email est déjà utilisé.' : 'Erreur lors de la création.';
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = '🔧 Rejoindre le réseau Tracium';
  }
};
</script>

<script>
function showTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.querySelectorAll('.tab')[tab === 'login' ? 0 : 1].classList.add('active');
}
window.showTab = showTab;
</script>

</body>
</html>
